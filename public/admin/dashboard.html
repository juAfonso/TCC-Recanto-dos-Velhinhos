<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Administrativo — Visão Geral</title>
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

<div class="admin-shell">
    <aside class="admin-sidebar" id="admin-menu"><!-- menu.html, carregado pelo admin-guard.js --></aside>

    <main class="admin-main">
        <div class="admin-topbar">
            <div>
                <span class="crumb">Painel Administrativo</span>
                <h1>Visão Geral</h1>
            </div>
            <button class="admin-menu-toggle" aria-label="Abrir menu">☰</button>
            <a href="../index.html" class="btn btn-outline btn-sm" target="_blank">Ver Portal Público ↗</a>
        </div>

        <div class="admin-content">

            <div class="stat-grid" id="stat-grid"><!-- preenchido via JS --></div>

            <div class="panel">
                <div class="panel-head">
                    <h2><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-exclamation-triangle-fill" viewBox="0 0 16 16">
  <path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5m.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2"/>
</svg> Alertas prioritários</h2>
                    <span class="panel-sub">Pendências de todas as filas, contadas agora</span>
                </div>
                <div id="alertas-lista" class="activity-list"></div>
            </div>

            <div class="panel">
                <div class="panel-head">
                    <h2><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-clock-history" viewBox="0 0 16 16">
  <path d="M8.515 1.019A7 7 0 0 0 8 1V0a8 8 0 0 1 .589.022zm2.004.45a7 7 0 0 0-.985-.299l.219-.976q.576.129 1.126.342zm1.37.71a7 7 0 0 0-.439-.27l.493-.87a8 8 0 0 1 .979.654l-.615.789a7 7 0 0 0-.418-.302zm1.834 1.79a7 7 0 0 0-.653-.796l.724-.69q.406.429.747.91zm.744 1.352a7 7 0 0 0-.214-.468l.893-.45a8 8 0 0 1 .45 1.088l-.95.313a7 7 0 0 0-.179-.483m.53 2.507a7 7 0 0 0-.1-1.025l.985-.17q.1.58.116 1.17zm-.131 1.538q.05-.254.081-.51l.993.123a8 8 0 0 1-.23 1.155l-.964-.267q.069-.247.12-.501m-.952 2.379q.276-.436.486-.908l.914.405q-.24.54-.555 1.038zm-.964 1.205q.183-.183.35-.378l.758.653a8 8 0 0 1-.401.432z"/>
  <path d="M8 1a7 7 0 1 0 4.95 11.95l.707.707A8.001 8.001 0 1 1 8 0z"/>
  <path d="M7.5 3a.5.5 0 0 1 .5.5v5.21l3.248 1.856a.5.5 0 0 1-.496.868l-3.5-2A.5.5 0 0 1 7 9V3.5a.5.5 0 0 1 .5-.5"/>
</svg> Atividade recente</h2>
                    <span class="panel-sub">Registro de autoria e data/hora das últimas ações administrativas</span>
                </div>
                <div id="atividade-lista" class="activity-list"></div>
            </div>

        </div>
    </main>
</div>

<script src="../assets/js/utils.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/admin-guard.js"></script>
<script src="../assets/js/admin-acoes.js"></script>
<script src="../assets/js/admin-dashboard.js"></script>
</body>
</html>
