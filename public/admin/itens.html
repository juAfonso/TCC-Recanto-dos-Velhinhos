<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Itens Necessários — Painel Administrativo</title>
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

<div class="admin-shell">
    <aside class="admin-sidebar" id="admin-menu"><!-- menu.html, carregado pelo admin-guard.js --></aside>

    <main class="admin-main">
        <div class="admin-topbar">
            <div>
                <span class="crumb">Painel Administrativo</span>
                <h1>Itens Necessários</h1>
            </div>
            <button class="admin-menu-toggle" aria-label="Abrir menu">☰</button>
            <button class="btn btn-viridian btn-sm" id="btn-novo-item">+ Novo item</button>
        </div>

        <div class="admin-content">
            <div class="panel">
                <div class="table-toolbar">
                    <div class="search-box">
                        <span><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-search" viewBox="0 0 16 16">
  <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/>
</svg></span>
                        <label for="busca-item" class="sr-only">Buscar item pelo nome</label>
                        <input type="search" id="busca-item" placeholder="Buscar por nome do item...">
                    </div>
                    <div style="font-size:.8rem;color:var(--muted);">
                        <span class="cell-flag" aria-hidden="true">●</span> sem atualização da quantidade há <span id="dias-sem-atualizacao">30</span> dias ou mais
                    </div>
                </div>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th scope="col">Item</th><th scope="col">Quantidade</th><th scope="col">Prioridade</th><th scope="col">Situação</th><th scope="col">Quantidade atualizada em</th><th scope="col">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="itens-tbody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>

<!-- MODAL: novo/editar item -->
<div class="modal-overlay" id="modal-item">
    <div class="modal">
        <div class="modal-head">
            <h3 id="modal-item-titulo">Novo item necessário</h3>
            <button class="modal-close" data-close-modal="modal-item">✕</button>
        </div>
        <form id="form-item" novalidate>
            <input type="hidden" id="item-id">
            <div class="form-group">
                <label for="item-nome">Nome do item <span class="req">*</span></label>
                <input type="text" id="item-nome" data-campo="nome" maxlength="120">
                <div class="form-error"></div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="item-quantidade">Quantidade <span class="req">*</span></label>
                    <input type="text" id="item-quantidade" data-campo="quantidade" inputmode="decimal">
                    <div class="form-error"></div>
                </div>
                <div class="form-group">
                    <label for="item-unidade">Unidade <span class="req">*</span></label>
                    <input type="text" id="item-unidade" data-campo="unidade" maxlength="40" placeholder="ex.: pacotes, unidades, kits">
                    <div class="form-error"></div>
                </div>
            </div>
            <div class="form-group">
                <label for="item-prioridade">Prioridade <span class="req">*</span></label>
                <select id="item-prioridade" data-campo="prioridade">
                    <option value="">Escolha…</option>
                    <option value="alta">Alta — precisamos com urgência</option>
                    <option value="media">Média — ajuda muito neste momento</option>
                    <option value="baixa">Baixa — sempre bem-vinda</option>
                </select>
                <p class="form-hint">Os de prioridade alta aparecem primeiro no site e entre os "mais urgentes" do Painel.</p>
                <div class="form-error"></div>
            </div>
            <div class="form-actions">
                <button type="button" class="btn btn-outline" data-close-modal="modal-item">Cancelar</button>
                <button type="submit" class="btn btn-viridian">Salvar item</button>
            </div>
        </form>
    </div>
</div>

<script src="../assets/js/utils.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/admin-guard.js"></script>
<script src="../assets/js/admin-modal.js"></script>
<script src="../assets/js/admin-itens.js"></script>
</body>
</html>
